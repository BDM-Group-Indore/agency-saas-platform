# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — Payment Security Configuration
# Phase 8: Billing SaaS Platform (Kunal's Infrastructure Scope)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Request ID Tracing ────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" req_id="$request_id" '
                    'upstream_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ─── Rate Limiting Zones ───────────────────────────────────────────────────
    # General API: 60 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

    # Payment Webhook: strict 10 requests/second (payment processor bursts)
    limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=10r/s;

    # Auth endpoints: 5 requests/minute per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

    limit_req_status 429;

    # ─── Connection Limiting ───────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Upstream — NestJS API ─────────────────────────────────────────────────
    upstream api_backend {
        server host.docker.internal:3000;
        keepalive 32;
    }

    # ─── Upstream — Next.js Frontend ──────────────────────────────────────────
    upstream web_frontend {
        server host.docker.internal:3001;
        keepalive 16;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server Block: HTTP → HTTPS redirect (production)
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check endpoint for docker/load-balancer probes
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # In production: redirect all HTTP → HTTPS
        # Uncomment when TLS certificates are provisioned:
        # return 301 https://$host$request_uri;

        # Development: proxy directly
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 30s;
        }

        # ── /api — General API proxy ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 60s;

            # Security headers
            add_header X-Content-Type-Options  "nosniff"        always;
            add_header X-Frame-Options         "DENY"           always;
            add_header X-XSS-Protection        "1; mode=block"  always;
            add_header Referrer-Policy         "strict-origin"  always;
        }

        # ── /api/auth — Auth Rate Limit (brute-force protection) ─────────────
        location /api/auth/ {
            limit_req zone=auth_zone burst=3 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 10s;
        }

        # ── /api/billing/payments/webhook — Strict Payment Webhook Security ───
        #
        # Protection layers:
        #   1. Strict rate limit: 10 req/s per IP, burst 5 (payment processor only)
        #   2. IP allowlist: Only known Stripe & Razorpay CIDR ranges accepted
        #   3. Method guard: Only POST accepted
        #   4. Body size: Capped at 256KB (webhook payloads are always small)
        #   5. Request-ID tracing header injected for full audit trail
        #
        location /api/billing/payments/webhook {
            # Method enforcement
            limit_except POST {
                deny all;
            }

            # Rate limiting — stricter dedicated zone
            limit_req zone=webhook_zone burst=5 nodelay;
            limit_conn conn_limit 10;

            # Body size cap (webhooks are small; block large request bombs)
            client_max_body_size 256k;

            # ── IP Allowlist: Stripe Production CIDR Ranges ──────────────────
            # Source: https://stripe.com/docs/ips
            allow 3.18.12.63/32;
            allow 3.130.192.231/32;
            allow 13.235.14.237/32;
            allow 13.235.122.149/32;
            allow 18.211.135.69/32;
            allow 35.154.171.200/32;
            allow 52.15.183.38/32;
            allow 54.88.130.119/32;
            allow 54.88.130.237/32;
            allow 54.187.174.169/32;
            allow 54.187.205.235/32;
            allow 54.187.216.72/32;

            # ── IP Allowlist: Razorpay Production CIDR Ranges ────────────────
            # Source: https://razorpay.com/docs/webhooks/
            allow 216.48.186.0/24;
            allow 52.66.0.0/16;
            allow 65.1.0.0/16;

            # Allow localhost for local dev & webhook simulators
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker internal bridge network
            allow ::1;

            # Deny all other IPs
            deny all;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 15s;

            # Log webhook hits separately for payment audit trails
            access_log /var/log/nginx/webhook_access.log main;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server Block: HTTPS (TLS) — uncomment when certs are provisioned
    # ─────────────────────────────────────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # ... same location blocks as above ...
    # }
}
