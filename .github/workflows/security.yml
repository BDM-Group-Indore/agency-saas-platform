name: Security Audit & SAST

# ─── Trigger: Run on every PR to main/develop + weekly scheduled scan ─────────
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Every Monday at 03:00 UTC — weekly proactive security scan
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # Required for CodeQL SARIF upload
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Dependency Vulnerability Audit (pnpm audit)
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: $(pnpm store path --silent)
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm security audit (fail on high/critical)
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Check for known vulnerable package versions
        run: |
          echo "=== Checking top-level dependencies ===" 
          pnpm list --depth=0 --json | head -200

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Secret Scanning (detect committed secrets)
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret & Credentials Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for secret scanning

      - name: Block .env files in CI
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(find . -name "*.env" -not -name "*.env.example" -not -path "*/node_modules/*")
          if [ -n "$ENV_FILES" ]; then
            echo "::error::CRITICAL SECURITY VIOLATION: Committed .env files detected: $ENV_FILES"
            exit 1
          fi
          echo "✅ No committed .env files found."

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Scan for hardcoded secrets with grep patterns
        run: |
          echo "Checking for hardcoded secrets in codebase..."
          FOUND=0

          # Check for hardcoded JWT secrets
          if grep -r "super-secret" apps/ packages/ --include="*.ts" --include="*.js" -l 2>/dev/null; then
            echo "::warning::Potential hardcoded JWT secret found"
            FOUND=1
          fi

          # Check for Stripe API keys in source
          if grep -rE "sk_live_[0-9a-zA-Z]{24}" apps/ packages/ --include="*.ts" --include="*.js" -l 2>/dev/null; then
            echo "::error::Hardcoded Stripe LIVE secret key detected!"
            FOUND=1
          fi

          # Check for Razorpay secrets in source
          if grep -rE "rzp_live_[a-zA-Z0-9]+" apps/ packages/ --include="*.ts" --include="*.js" -l 2>/dev/null; then
            echo "::error::Hardcoded Razorpay LIVE key detected!"
            FOUND=1
          fi

          # Check for webhook secrets in source
          if grep -rE "whsec_[a-zA-Z0-9]+" apps/ packages/ --include="*.ts" --include="*.js" -l 2>/dev/null; then
            echo "::error::Hardcoded Stripe webhook secret detected in source!"
            FOUND=1
          fi

          # Fail if any issues found
          if [ "$FOUND" -eq "1" ]; then
            echo "::error::Secret scan failed. Remove hardcoded secrets and use environment variables."
            exit 1
          fi

          echo "✅ No hardcoded secrets detected."

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: CodeQL SAST Analysis (Static Application Security Testing)
  # ─────────────────────────────────────────────────────────────────────────────
  codeql-sast:
    name: CodeQL Static Analysis (SAST)
    runs-on: ubuntu-latest
    # Skip on dependabot PRs (CodeQL doesn't need to run there)
    if: github.actor != 'dependabot[bot]'

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL engine
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config: |
            paths:
              - apps/api/src
              - packages/shared-types/src
              - packages/database/src

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (required for full build)
        run: pnpm --filter @saas/database run prisma:generate

      - name: Build packages for CodeQL analysis
        run: pnpm --filter @saas/database run build && pnpm --filter @saas/shared-types run build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Container Image Vulnerability Scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-container-scan:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan postgres base image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'postgres:17'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan redis base image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'redis:7.0-alpine'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan nginx base image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nginx:1.27-alpine'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan ClickHouse base image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'clickhouse/clickhouse-server:24.3-alpine'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Nginx Configuration Lint
  # ─────────────────────────────────────────────────────────────────────────────
  nginx-config-lint:
    name: Nginx Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Nginx config syntax
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.27-alpine nginx -t -c /etc/nginx/nginx.conf
