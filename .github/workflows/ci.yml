name: Monorepo CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code repository
      uses: actions/checkout@v4

    - name: Set up Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm Package Manager
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Get pnpm cache directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install all Workspace Dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Database schema generators
      run: pnpm --filter @saas/database run prisma:generate

    - name: Compile database package
      run: pnpm --filter @saas/database run build

    - name: Compile shared types package
      run: pnpm --filter @saas/shared-types run build

    - name: Lint checking across all modules
      run: pnpm run lint

    - name: Build check Next.js and NestJS API workspaces
      run: pnpm run build
