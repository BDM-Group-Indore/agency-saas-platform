name: Monorepo CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shadow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm cache directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install all Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prisma migrations are in sync with schema
        run: pnpm --filter @saas/database exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://postgres:password@localhost:5432/shadow_db?schema=public" --exit-code

      - name: Run Database schema generators
        run: pnpm --filter @saas/database run prisma:generate

      - name: Compile database package
        run: pnpm --filter @saas/database run build

      - name: Compile shared types package
        run: pnpm --filter @saas/shared-types run build

      - name: Compile UI components package
        run: pnpm --filter @saas/ui run build

      - name: Lint checking across all modules
        run: pnpm run lint

      - name: Run NestJS API unit tests with coverage gates
        run: pnpm --filter @saas/api run test:cov

      - name: Build check Next.js and NestJS API workspaces
        run: pnpm run build

  docker-build:
    name: Docker Builds Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NestJS API Docker Image
        run: docker build -t saas-api:test -f apps/api/Dockerfile .

      - name: Build Next.js Frontend Docker Image
        run: docker build -t saas-web:test -f apps/web/Dockerfile .

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: infrastructure/terraform

      - name: Terraform Init (Offline)
        run: terraform init -backend=false
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Terraform Plan (Dry Run)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS Credentials detected. Running terraform plan..."
            terraform init -reconfigure
            terraform plan
          else
            echo "AWS Credentials not set. Skipping terraform plan."
          fi
        working-directory: infrastructure/terraform
        shell: bash
