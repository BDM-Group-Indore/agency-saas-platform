name: Monorepo CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shadow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code repository
      uses: actions/checkout@v4

    - name: Set up Node.js v22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pnpm Package Manager
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Get pnpm cache directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install all Workspace Dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify Prisma migrations are in sync with schema
      run: pnpm --filter @saas/database exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://postgres:password@localhost:5432/shadow_db?schema=public" --exit-code

    - name: Run Database schema generators
      run: pnpm --filter @saas/database run prisma:generate

    - name: Compile database package
      run: pnpm --filter @saas/database run build

    - name: Compile shared types package
      run: pnpm --filter @saas/shared-types run build

    - name: Lint checking across all modules
      run: pnpm run lint

    - name: Build check Next.js and NestJS API workspaces
      run: pnpm run build
